$('mBack').addEventListener('click', () => showMenu(false));
$('mn').addEventListener('click', () => showMenu(false));

/* ---------- boot ---------- */
function layout() { stage.classList.toggle('rot', innerHeight > innerWidth); fit(); }
layout();
addEventListener('resize', layout);
addEventListener('orientationchange', layout);
document.addEventListener('fullscreenchange', layout);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
showMenu(false);
let last = performance.now(), acc = 0, failed = false;
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(.1, (now - last) / 1000); last = now;
  try {
    let n = 0;
    while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
    if (n === 5) acc = 0;
    render();
  } catch (err) { if (!failed) { failed = true; console.error(err); } }
}
requestAnimationFrame(frame);
})();
</script>
